[package]
name = "pixelsong"
version = "1.0.0"
description = "PixelSong — a premium, fully offline music player for Windows"
authors = ["PixelSong Team"]
edition = "2021"

[lib]
name = "pixelsong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.21"
directories = "5.0"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
walkdir = "2.5"
sha2 = "0.10"
base64 = "0.22"
log = "0.4"
